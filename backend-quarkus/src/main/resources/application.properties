quarkus.http.port=8090
quarkus.http.root-path=/
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.package.jar.type=mutable-jar
quarkus.package.jar.user-providers-directory=providers

# Build-time selection of persistent manager meta storage backend: IN_MEMORY or XODUS.
# Dataset definitions are always loaded from configured metadata folders into memory at startup.
conquery.storage.backend=IN_MEMORY

# SQL execution is activated explicitly after named Quarkus datasources have been configured.
conquery.sql.enabled=false
