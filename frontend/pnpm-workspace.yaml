# Supply-chain hardening (see https://pnpm.io/settings)
# Refuse versions published less than 7 days ago
minimumReleaseAge: 10080
# Refuse versions whose publish provenance/trust is weaker than a previous release
trustPolicy: no-downgrade
# Old transitive releases that predate their package's provenance; revisit when they drop out of the tree
trustPolicyExclude:
  - "semver@6.3.1"
  # security backport on the 1.x line (cosmiconfig via emotion's babel-plugin-macros), 2.x had provenance first
  - "yaml@1.10.3"
# Lifecycle scripts are blocked unless explicitly allowed here
allowBuilds:
  esbuild: true
# Security fixes for transitive deps whose parents allow but don't pull in the patched version
# (yaml 1.x via emotion's babel-plugin-macros, yaml 2.x as vite's optional dep; GHSA-48c2-rrv3-qjmp)
overrides:
  "yaml@1": "^1.10.3"
  "yaml@2": "^2.8.3"
