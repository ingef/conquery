name: "Test Backend"

# Called from ci.yml, which decides based on the changed paths whether this runs.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: true
    - name: Cache local Maven repository
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'
        overwrite-settings: false
    - name: Build Backend
      run: mvn -T 1C install -pl backend -DskipTests -am

  test:
    name: test (${{ matrix.test-group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: true
      matrix:
        test-group:
          - name: Unit Test
            flags: -pl backend,news-service -DexcludedGroups="INTEGRATION_PROGRAMMATIC, INTEGRATION_JSON, INTEGRATION_SQL_BACKEND"
          - name: Programmatic Integration Tests
            flags: -pl backend -Dgroups="INTEGRATION_PROGRAMMATIC"
          - name: JSON based Integration Tests
            flags: -pl backend -Dgroups="INTEGRATION_JSON"
          - name: SQL based Integration Tests
            flags: -pl backend -Dgroups="INTEGRATION_SQL_BACKEND"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          overwrite-settings: false
      - name: ${{ matrix.test-group.name }}
        run: mvn test -T 1C ${{ matrix.test-group.flags }}
